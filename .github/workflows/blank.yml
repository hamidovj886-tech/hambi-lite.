
name: Build Hambi Lite APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking Hambi Lite project..."
          ls -la
          echo "Checking workflow..."
          ls -la .github/workflows
          echo "Checking Android project structure..."
          test -f settings.gradle
          test -f build.gradle
          test -f MainActivity.java
          test -f AndroidManifest.xml
          echo "Project files found."
